# STAGING. Tất cả dùng network host: Postgres chỉ nghe localhost, Keycloak/API chỉ bind 127.0.0.1.
services:
  api:
    image: hcos-api:staging
    network_mode: host
    restart: unless-stopped
    env_file: ./hcos.env
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    network_mode: host
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: https://smart.id.vn/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTP_PORT: "8081"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://127.0.0.1:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./kc-import:/opt/keycloak/data/import:ro
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  caddy-data:
